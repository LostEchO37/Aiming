    <h1>关于</h1>
    <p>Aiming 是一个免费的网站。一个宇宙是一块地方：你在里面学习，讨论可以一起做的事，找人一起做。</p>
    <p>可以从营销、人事、数字开发、美术、安全走进去。材料还不多，页面是可以走通的。看和学不必登录。写下讨论或同路人纸条需要注册，不收费。看过的标记仍只留在这台浏览器。</p>
    <p>这个网站由香港的一间小公司制作。公司是制作者，宇宙才是这里的内容。</p>
