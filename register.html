<script>
try{var s=JSON.parse(localStorage.getItem("aiming.settings.v1")||"{}");var r=document.documentElement;if(s.theme==="dark")r.setAttribute("data-theme","dark");r.setAttribute("data-lang",s.language||"zh");if(s.language==="en")r.lang="en";else if(s.language==="zhHant")r.lang="zh-Hant";if(s.reduceMotion)r.setAttribute("data-motion","reduce");}catch(e){}
</script>

  <main id="content" class="page" tabindex="-1">
    <p class="page-tag">账号</p>
    <h1 class="page-title">注册</h1>
    <p class="page-intro">注册是免费的。用来在宇宙里写下讨论和同路人纸条。</p>
    <noscript><p class="banner">需要打开浏览器的脚本，才能注册。</p></noscript>
    <p class="status" id="status" role="status"></p>
    <form id="account-form" class="form-card" novalidate>
      <label class="field-label">怎么称呼
        <input class="field" name="displayName" type="text" autocomplete="nickname" maxlength="20" aria-describedby="err-name" required>
        <span class="field-error" id="err-name" hidden></span>
      </label>
      <label class="field-label">邮箱
        <input class="field" name="email" type="email" autocomplete="username" inputmode="email" maxlength="254" aria-describedby="err-email" required>
        <span class="field-error" id="err-email" hidden></span>
      </label>
      <label class="field-label">密码
        <input class="field" name="password" type="password" autocomplete="new-password" maxlength="72" aria-describedby="err-password" required>
        <span class="field-error" id="err-password" hidden></span>
      </label>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">注册</button>
      </div>
    </form>
    <p>已有账号？<a href="login.html" data-next>登录</a></p>
  </main>
